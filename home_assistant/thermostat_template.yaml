    # Controls all real thermostats at once. Mode is "heat" if any thermostat
    # heats; temperatures are averages over the available thermostats.
    - name: "All thermostats"
      unique_id: all_thermostats
      availability: "{{ ['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents'] | select('has_value') | list | count > 0 }}"
      hvac_modes: "{{ ['off', 'heat'] }}"
      hvac_mode: >
        {% set modes = expand(['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents']) | map(attribute='state') | list %}
        {{ 'heat' if 'heat' in modes else 'off' if 'off' in modes else none }}
      hvac_action: >
        {% set actions = expand(['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents']) | map(attribute='attributes.hvac_action') | list %}
        {% if 'heating' in actions %}heating
        {% elif 'idle' in actions %}idle
        {% elif 'off' in actions %}off
        {% else %}{{ none }}{% endif %}
      current_temperature: >
        {% set t = expand(['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents']) | map(attribute='attributes.current_temperature') | select('is_number') | list %}
        {{ (t | sum / t | count) | round(1) if t else none }}
      target_temperature: >
        {% set ns = namespace(t=[]) %}
        {% for s in expand(['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents']) %}
          {% set attr = 'temperature' if s.attributes.supported_features | int(0) | bitwise_and(1) else 'target_temp_low' %}
          {% if s.attributes[attr] is number %}
            {% set ns.t = ns.t + [s.attributes[attr]] %}
          {% endif %}
        {% endfor %}
        {{ (ns.t | sum / ns.t | count) | round(1) if ns.t else none }}
      min_temperature: 5
      max_temperature: 30
      target_temperature_step: 0.5
      precision: 0.1
      set_hvac_mode:
        - action: climate.set_hvac_mode
          target:
            entity_id: "{{ ['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents'] | select('has_value') | list }}"
          data:
            hvac_mode: "{{ hvac_mode }}"
      set_temperature:
        - repeat:
            for_each: "{{ ['climate.therm_eg', 'climate.therm_sofia', 'climate.therm_daria', 'climate.therm_parents'] | select('has_value') | list }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ state_attr(repeat.item, 'supported_features') | int(0) | bitwise_and(1) == 0 }}"
                then:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      target_temp_low: "{{ temperature }}"
                      target_temp_high: "{{ [state_attr(repeat.item, 'target_temp_high') | float(30), temperature | float] | max }}"
                else:
                  - action: climate.set_temperature
                    target:
                      entity_id: "{{ repeat.item }}"
                    data:
                      temperature: "{{ temperature }}"
