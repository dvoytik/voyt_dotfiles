# Template climate entities that wrap existing thermostats and expose only
# heat/off modes and a single target temperature. Fan, preset, swing,
# humidity and low/high range controls of the real devices are not exposed.
#
# Include from configuration.yaml with:
#   template: !include thermostat_template.yaml
# or paste the list below under an existing `template:` key.
#
# Each block reads one real thermostat. The target temperature
# uses the device's `temperature` attribute, or `target_temp_low` for devices
# that don't support a single target temperature (supported_features bit 1)
# and only accept a low/high range.

- climate:
    - name: "Thermostat Living Room"
      unique_id: thermostat_living_room
      availability: "{{ states('climate.therm_eg') not in ['unavailable', 'unknown'] }}"
      hvac_modes: "{{ ['off', 'heat'] }}"
      hvac_mode: >
        {% set mode = states('climate.therm_eg') %}
        {{ mode if mode in ['off', 'heat'] else none }}
      hvac_action: >
        {% set action = state_attr('climate.therm_eg', 'hvac_action') %}
        {{ action if action in ['off', 'idle', 'heating'] else none }}
      current_temperature: "{{ state_attr('climate.therm_eg', 'current_temperature') }}"
      target_temperature: >
        {% if state_attr('climate.therm_eg', 'supported_features') | int(0) | bitwise_and(1) %}
          {{ state_attr('climate.therm_eg', 'temperature') }}
        {% else %}
          {{ state_attr('climate.therm_eg', 'target_temp_low') }}
        {% endif %}
      min_temperature: 5
      max_temperature: 30
      target_temperature_step: 0.5
      precision: 0.1
      set_hvac_mode:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.therm_eg
          data:
            hvac_mode: "{{ hvac_mode }}"
      set_temperature:
        - if:
            - condition: template
              value_template: "{{ state_attr('climate.therm_eg', 'supported_features') | int(0) | bitwise_and(1) == 0 }}"
          then:
            - action: climate.set_temperature
              target:
                entity_id: climate.therm_eg
              data:
                target_temp_low: "{{ temperature }}"
                target_temp_high: "{{ [state_attr('climate.therm_eg', 'target_temp_high') | float(30), temperature | float] | max }}"
          else:
            - action: climate.set_temperature
              target:
                entity_id: climate.therm_eg
              data:
                temperature: "{{ temperature }}"

